name: Build BOTB Judges Edition unsigned IPA
on:
  push:
    branches: [main]
    paths: ['*.swift', '*.py', '*.json', 'project.yml', 'README.md', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-ios-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python regression checks
        id: python_checks
        run: python3 -m unittest test_auth_model test_coordinate_engine test_crosshair_records test_multi_judge -v
      - name: Swift seven-judge core checks
        id: core_checks
        run: |
          set -euo pipefail
          mkdir -p build
          swiftc CoordinateEngine.swift SevenJudgePanel.swift SevenJudgePanelChecks.swift -o build/seven-judge-checks
          build/seven-judge-checks
      - name: Install XcodeGen
        id: toolchain
        run: brew install xcodegen
      - name: Generate project
        id: generate
        run: xcodegen generate --spec project.yml
      - name: Build unsigned app
        id: ios_build
        run: |
          set -euo pipefail
          xcodebuild -project BOTBJudgesEdition.xcodeproj -scheme BOTBJudgesEdition -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee build_log.txt
      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/BOTB Judges Edition.app"
          test -d "$APP"
          plutil -lint "$APP/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = com.botb.judges.edition
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry BOTB_Seven_Judges_unsigned.ipa Payload
          unzip -t BOTB_Seven_Judges_unsigned.ipa
          shasum -a 256 BOTB_Seven_Judges_unsigned.ipa > IPA_SHA256.txt
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: build_log.txt
          if-no-files-found: ignore
      - name: Upload standalone seven-judge IPA
        id: ipa_upload
        uses: actions/upload-artifact@v4
        with:
          name: BOTB_Seven_Judges_standalone_unsigned
          path: |
            BOTB_Seven_Judges_unsigned.ipa
            IPA_SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Write actual build evidence
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, plistlib, subprocess, zipfile
          steps = json.loads(os.environ['STEP_RESULTS'])
          outcomes = {k: steps.get(k, {}).get('outcome', 'missing') for k in ['python_checks', 'core_checks', 'toolchain', 'generate', 'ios_build', 'package', 'ipa_upload']}
          report = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'step_outcomes': outcomes, 'status': 'passed' if all(v == 'success' for v in outcomes.values()) else 'failed', 'scope': 'Standalone seven-judge app only', 'iphone_runtime_test': 'NOT PERFORMED', 'original_large_ipa_integration': 'NOT PERFORMED'}
          ipa = pathlib.Path('BOTB_Seven_Judges_unsigned.ipa')
          if outcomes['package'] == 'success' and ipa.exists():
              report['ipa_bytes'] = ipa.stat().st_size
              report['ipa_sha256'] = hashlib.sha256(ipa.read_bytes()).hexdigest()
              with zipfile.ZipFile(ipa) as z:
                  name = 'Payload/BOTB Judges Edition.app/Info.plist'
                  info = plistlib.loads(z.read(name))
                  report['bundle_id'] = info.get('CFBundleIdentifier')
                  report['version'] = info.get('CFBundleShortVersionString')
                  executable = 'Payload/BOTB Judges Edition.app/' + info['CFBundleExecutable']
                  with z.open(executable) as f:
                      report['executable_magic_hex'] = f.read(4).hex()
          out = pathlib.Path('verification/ios-build')
          out.mkdir(parents=True, exist_ok=True)
          text = json.dumps(report, indent=2) + '\n'
          (out / 'result.json').write_text(text)
          log = pathlib.Path('build_log.txt')
          (out / 'build-log-tail.txt').write_text(log.read_text(errors='replace')[-40000:] if log.exists() else 'iOS build log unavailable; inspect failed preceding step.\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Verified standalone build evidence\n```json\n' + text + '```\n')
      - name: Publish build evidence to repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f verification/ios-build/result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- verification/ios-build/result.json verification/ios-build/build-log-tail.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual iOS build and IPA verification results'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
